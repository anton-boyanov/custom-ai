apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-model-serving
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:anton-boyanov/custom-ai.git
    targetRevision: main
    path: model-serving

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
