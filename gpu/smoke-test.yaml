apiVersion: v1
kind: Namespace
metadata:
  name: gpu-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nvidia-smi
  namespace: gpu-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: nvidia-smi
          image: nvidia/cuda:12.8.1-base-ubuntu24.04
          command:
            - nvidia-smi
          resources:
            limits:
              nvidia.com/gpu: 1
